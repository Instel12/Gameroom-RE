<script>
(async () => {
    try {
        const res = await fetch(
            "https://cdn.jsdelivr.net/gh/Instel12/Gameroom-RE@main/singlefile.html?t=" + Date.now()
        );
        const text = await res.text();
        document.open();
        document.write(text);
        document.close();
    } catch (err) {
        alert('Failed to load content!');
        console.error(err);
    }
})();
</script>
