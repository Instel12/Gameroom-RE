<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
button {
    font-size: 20px;
    font-family: 'Press Start 2P';
    color: white;
    background-color: #cc4331;
    border: none;
    border-radius: 5px;
    width: 100%;
    height: 50px;
    cursor: pointer;
}
body { display: flex; flex-direction: column;
    background-color: #1c1c1c;
    color: #fff;
    padding: 0;
    margin: 0;
    font-family: "Press Start 2P";
}

.banner {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 55px;
    width: 100%;
    height: 35vh;
    background-image: url("https://cdn.jsdelivr.net/gh/Instel12/Gameroom-RE@main/static/banner.gif");
    background-color: #cc4331;
    background-position: center;
    background-size: cover;
}

.content {
    background-color: #2f2f2f;
    position: absolute;
    left: 0px;
    top: 0;
    width: 100%;
    min-height: 100vh;
}

.pagemargin {
    margin: 50px;
    padding: 50px;
}

hr {
    border: none;
    border-top: 3px solid #444;
}
</style>
</head>
<body>
<div class="content">

<div class="banner">
<center>GAMEROOM RE<p>LAUNCHER</center>
</div>
            <div style="margin-top: -20px;" class="pagemargin" id="maincontent">
<center><h1>Welcome!</h1></center>
<br><br><br>
<hr>
<br><br><br>
Click the launch button below to launch Gameroom.
<br><br><br>
<hr>
<br><br><br>
What we offer:<br><br><br>
<ul>
<li>A repo system so you can litterally get infinite games.</li><br><br>
<li>A ton of games by default.</li><br><br>
<li>Active updates</li><br><br>
<li>And best of all, <span class="warning">this is just the beta!</span></li>
</ul>
<br><br>
<hr>
<br><br>
So, what do you say?
<br><br><br>
<button id='fullscreenBtn'>Launch</button>
</div>
<script>
const gameUrl = 'https://cdn.jsdelivr.net/gh/Instel12/Gameroom-RE@main/singlefile.html?t=' + Date.now();
document.getElementById('fullscreenBtn').onclick = async () => {
    try {
        const res = await fetch(gameUrl);
        const text = await res.text();
        const newWindow = window.open('about:blank', '_blank');
        if (newWindow) {
            newWindow.document.open();
            newWindow.document.write(text);
            newWindow.document.close();
        } else {
            alert('Pop-up blocked. Please allow pop-ups for this site.');
        }
    } catch (err) {
        alert('Failed to load content!');
    }
};

    let isRed = true;
    setInterval(() => {
        const warnings = document.querySelectorAll(".warning");
        warnings.forEach(el => el.style.color = isRed ? "yellow" : "red");
        isRed = !isRed;
    }, 300);
</script>
</body>
</html>
